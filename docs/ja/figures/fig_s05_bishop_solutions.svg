<svg xmlns="http://www.w3.org/2000/svg" width="760" height="358" viewBox="0 0 760 358" role="img" aria-labelledby="title desc">
  <title id="title">簡易Bishop法のつり合い式を満たす安全率（模式図）</title>
  <desc id="desc">底面が上るスライスが3本あるときの，底面せん断力の和（緑の曲線）と，自重による項の和（赤の破線）．底面せん断力の和は，各スライスの F* で途切れ，その上では正の大きな値に，下では負の大きな値になる．そのため，隣り合う F* の間ごとに，2つの和が等しくなる安全率がある（白丸）．この図では，最も小さい F* の下にも1つある．そこでは，少なくとも1つのスライスの分母が負である．最も大きい F* より上では，曲線は単調に減少し，2つの和は1回だけ等しくなる（黒丸）．すべてのスライスで分母が正になる解は，これだけである．</desc>
  <style>.t{font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP','Yu Gothic',Meiryo,sans-serif}.m{font-family:'STIX Two Text','Cambria','Times New Roman',serif}</style>
